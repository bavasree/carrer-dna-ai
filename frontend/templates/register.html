{% extends "base.html" %}

{% block title %}Create Account — Career DNA AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
            <div class="card bg-surface-card p-4 p-sm-5 shadow-xl border border-subtle">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo-icon.svg') }}" alt="Career DNA AI" width="56" height="56" class="mb-3 rounded-3 shadow">
                    <h3 class="fw-bold text-light mb-1">Create Your Account</h3>
                    <p class="text-secondary small">Start unlocking personalized opportunities & AI career guidance</p>
                </div>

                <form id="registerForm">
                    <!-- Role Toggle -->
                    <div class="mb-3 text-center">
                        <label class="form-label d-block text-start">Account Role</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="regRole" id="roleStudent" value="student" checked>
                            <label class="btn btn-outline-primary py-2" for="roleStudent"><i class="bi bi-mortarboard me-1"></i>Student</label>

                            <input type="radio" class="btn-check" name="regRole" id="roleAdmin" value="admin">
                            <label class="btn btn-outline-primary py-2" for="roleAdmin"><i class="bi bi-shield-lock me-1"></i>Admin</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="regFullName">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="regFullName" placeholder="Alex Morgan" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="regEmail">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3" id="careerGoalGroup">
                        <label class="form-label" for="regCareerGoal">Primary Career Goal (Optional)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-flag"></i></span>
                            <input type="text" class="form-control" id="regCareerGoal" placeholder="e.g. Full-Stack Software Engineer, ML Engineer">
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label" for="regPassword">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="regConfirmPassword">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="regConfirmPassword" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="btnRegisterSubmit" class="btn btn-gradient-primary w-100 py-2 fw-semibold mb-3">
                        Create Account & Begin Onboarding <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center small text-secondary">
                    Already have an account? <a href="/login" class="text-primary text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
