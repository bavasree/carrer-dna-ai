{% extends "base.html" %}

{% block title %}Sign In — OPPORA AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
            <div class="card bg-surface-card p-4 p-sm-5 shadow-xl border border-subtle">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo-icon.svg') }}" alt="OPPORA AI" width="56" height="56" class="mb-3 rounded-3 shadow">
                    <h3 class="fw-bold text-light mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Sign in to your OPPORA AI account</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="loginEmail">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold" for="loginPassword">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 py-2 fw-semibold mb-3" id="loginSubmitBtn">
                        Sign In <i class="bi bi-arrow-right ms-1"></i>
                    </button>
                </form>

                <div class="text-center small text-secondary">
                    Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
