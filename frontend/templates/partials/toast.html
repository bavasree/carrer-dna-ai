<!-- Global Bootstrap Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
    <div id="liveAppToast" class="toast align-items-center bg-surface-elevated text-light border border-subtle" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header bg-surface text-light border-bottom border-subtle">
            <i id="appToastIcon" class="bi bi-info-circle-fill text-primary me-2"></i>
            <strong class="me-auto" id="appToastTitle">Notification</strong>
            <small class="text-muted">Just now</small>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body small" id="appToastBody">
            Message details...
        </div>
    </div>
</div>
