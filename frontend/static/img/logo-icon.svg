<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="iconGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F19" stroke="url(#iconGrad1)" stroke-width="2" />
  
  <!-- Outer Orbit -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" stroke-dasharray="3 3" />
  
  <!-- DNA Double Helix -->
  <path d="M 18 19 Q 32 32 46 19 Q 32 45 18 45" fill="none" stroke="url(#iconGrad1)" stroke-width="3.5" stroke-linecap="round" filter="url(#iconGlow)" />
  <path d="M 46 45 Q 32 32 18 45 Q 32 19 46 19" fill="none" stroke="url(#iconGrad2)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Base Pairs -->
  <line x1="24" y1="24" x2="40" y2="24" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="40" x2="40" y2="40" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" />

  <!-- Central Core Spark -->
  <circle cx="32" cy="32" r="4" fill="#FFFFFF" filter="url(#iconGlow)" />
  <polygon points="32,24 34.5,30 40,32 34.5,34 32,40 29.5,34 24,32 29.5,30" fill="#06B6D4" opacity="0.85" />
</svg>
