<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Emblem -->
  <g transform="translate(10, 10)">
    <!-- Rounded Background Hexagon/Shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#111827" stroke="url(#dnaGrad1)" stroke-width="2" />
    
    <!-- Outer Glow Orbit -->
    <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5" stroke-dasharray="3 3" />
    
    <!-- DNA Strand 1 (Sine wave curve) -->
    <path d="M 16 18 Q 30 30 44 18 Q 30 42 16 42" fill="none" stroke="url(#dnaGrad1)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- DNA Strand 2 (Opposing curve) -->
    <path d="M 44 42 Q 30 30 16 42 Q 30 18 44 18" fill="none" stroke="url(#dnaGrad2)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Connecting Base Pairs / Neural Bridges -->
    <line x1="22" y1="23" x2="38" y2="23" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="37" x2="38" y2="37" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" />

    <!-- Central AI Spark / Star of Intelligence -->
    <circle cx="30" cy="30" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
    <polygon points="30,22 32,28 38,30 32,32 30,38 28,32 22,30 28,28" fill="#06B6D4" opacity="0.8" />
  </g>

  <!-- Typography: CareerDNA -->
  <g transform="translate(85, 48)">
    <text font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#F9FAFB" letter-spacing="-0.5">
      Career<tspan fill="url(#textGrad)">DNA</tspan>
    </text>
    <text x="0" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="9.5" fill="#9CA3AF" letter-spacing="1.5">
      STUDENT OPPORTUNITY PLATFORM
    </text>
  </g>

  <!-- AI Badge -->
  <g transform="translate(345, 25)">
    <rect x="0" y="0" width="36" height="24" rx="6" fill="url(#badgeGrad)" />
    <text x="18" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">
      AI
    </text>
  </g>
</svg>
